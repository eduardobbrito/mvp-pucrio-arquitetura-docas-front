# nginx da interface Docas: serve o build estático da SPA.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Rotas do React Router (/pedidos/13...) não existem como arquivo:
    # se o caminho não for encontrado, entrega o index.html e o React resolve.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Arquivos com hash no nome podem ficar em cache por longo tempo
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
